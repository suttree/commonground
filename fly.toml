app = 'commonground-pilot'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  RAILS_ENV = 'production'
  DATABASE_PATH = '/data/production.sqlite3'
  RAILS_MAX_THREADS = '3'
  SMTP_ADDRESS = 'email-smtp.eu-west-2.amazonaws.com'
  SMTP_PORT = '587'
  SMTP_DOMAIN = 'commonground-pilot.fly.dev'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/up'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
